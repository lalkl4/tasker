# Оверлей для разработки. Накладывается поверх compose.yaml:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
# или просто `make dev`.
#
# Ожидает, что соседние репозитории лежат рядом:
#   ../tasker-api  ../tasker-web

services:
  api:
    build:
      context: ../tasker-api
      args:
        VERSION: dev
    image: tasker-api:dev
    volumes:
      # Правки в исходниках видны сразу, пересборка не нужна
      - ../tasker-api/app:/app/app:ro
      - ../tasker-api/migrations:/app/migrations:ro
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0 --port 8000 --reload
    ports:
      # Прямой доступ мимо Caddy — удобно дёргать API curl'ом
      - "8000:8000"

  migrate:
    build:
      context: ../tasker-api
      args:
        VERSION: dev
    image: tasker-api:dev
    volumes:
      - ../tasker-api/migrations:/app/migrations:ro

  web:
    build:
      context: ../tasker-web
    image: tasker-web:dev
    volumes:
      # Статику можно править без пересборки образа
      - ../tasker-web/src:/usr/share/nginx/html:ro
    ports:
      - "8080:8080"

  db:
    ports:
      # Чтобы подключиться psql или графическим клиентом с хоста
      - "5432:5432"
