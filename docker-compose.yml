# Полноценный запуск: сервер + PostgreSQL.
# Для одного контейнера на SQLite compose не нужен — см. README.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tasker
      POSTGRES_DB: tasker
      POSTGRES_PASSWORD: ${TASKER_DB_PASSWORD:-tasker}
    volumes:
      - tasker-db:/var/lib/postgresql/data
    healthcheck:
      # Сервер стартует только после того, как база начала принимать соединения
      test: ["CMD-SHELL", "pg_isready -U tasker -d tasker"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  tasker:
    build: .
    image: lalkl4/tasker:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      TASKER_DATABASE_URL: postgresql+psycopg://tasker:${TASKER_DB_PASSWORD:-tasker}@db:5432/tasker
      # Пустой секрет сервер сгенерирует сам и сохранит в томе
      TASKER_JWT_SECRET: ${TASKER_JWT_SECRET:-}
      TASKER_CORS_ORIGINS: ${TASKER_CORS_ORIGINS:-*}
      TASKER_ALLOW_REGISTRATION: ${TASKER_ALLOW_REGISTRATION:-true}
    ports:
      - "8000:8000"
    volumes:
      - tasker-data:/app/data
    restart: unless-stopped

volumes:
  tasker-db:
  tasker-data:
