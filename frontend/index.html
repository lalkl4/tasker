<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%E2%9C%93</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Экран входа: показывается, пока нет действующего токена -->
  <section id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card">
      <div class="brand brand-lg"><span class="logo">✓</span> Tasker</div>
      <p id="auth-subtitle" class="auth-sub">Вход в свой трекер задач</p>

      <label>Email
        <input id="auth-email" type="email" autocomplete="username" required>
      </label>
      <label>Пароль
        <input id="auth-password" type="password" autocomplete="current-password"
               minlength="8" required>
      </label>
      <label id="auth-name-row" hidden>Как вас звать
        <input id="auth-name" type="text" maxlength="80" autocomplete="nickname">
      </label>

      <p id="auth-error" class="auth-error" hidden></p>
      <button id="auth-submit" type="submit">Войти</button>

      <p class="auth-switch">
        <span id="auth-switch-text">Ещё нет учётной записи?</span>
        <a href="#" id="auth-switch">Зарегистрироваться</a>
      </p>
      <p id="auth-closed" class="auth-sub" hidden>
        Регистрация на этом сервере закрыта — попросите владельца создать вам доступ.
      </p>
      <p class="auth-server" id="auth-server"></p>
    </form>
  </section>

  <!-- Основное приложение -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="logo">✓</span> Tasker</div>
      <input id="search" class="search" type="search" placeholder="Поиск по задачам…" autocomplete="off">
      <div class="user">
        <span id="user-name" class="user-name"></span>
        <a class="docs-link" href="/docs" target="_blank" rel="noopener">API</a>
        <button id="logout" class="ghost">Выйти</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2 class="side-title">Проекты</h2>
        <ul id="projects" class="projects"></ul>

        <form id="project-form" class="project-form">
          <input id="project-name" type="text" placeholder="Новый проект" maxlength="60" required>
          <input id="project-color" type="color" value="#6366f1" title="Цвет проекта">
          <button type="submit" title="Добавить проект">+</button>
        </form>
      </aside>

      <section class="content">
        <div id="stats" class="stats"></div>

        <form id="task-form" class="task-form">
          <input id="task-title" type="text" placeholder="Что нужно сделать?" maxlength="200" required>
          <select id="task-priority" title="Приоритет">
            <option value="3">Высокий</option>
            <option value="2" selected>Средний</option>
            <option value="1">Низкий</option>
          </select>
          <input id="task-due" type="date" title="Срок">
          <button type="submit">Добавить</button>
        </form>

        <div class="board">
          <div class="column" data-status="todo">
            <h3>К выполнению <span class="count" id="count-todo">0</span></h3>
            <div class="cards" id="col-todo"></div>
          </div>
          <div class="column" data-status="doing">
            <h3>В работе <span class="count" id="count-doing">0</span></h3>
            <div class="cards" id="col-doing"></div>
          </div>
          <div class="column" data-status="done">
            <h3>Готово <span class="count" id="count-done">0</span></h3>
            <div class="cards" id="col-done"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
